name: Build Windows Installer (.EXE)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Production Windows Executable (.EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize Public NPM Package Versions
        run: node scripts/normalize-ci-package.mjs

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Master & User Windows Executables (.EXE) + Master & User Android Apps (.APK)
        run: node scripts/build-dual-installers.mjs
        env:
          CI: false
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_BUILD_VERSION: "1.0.${{ github.run_number }}"

      - name: Upload Direct User Windows .EXE Artifact (AKASH-TUNNEL-MAPPER-User-Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: AKASH-TUNNEL-MAPPER-User-Setup.exe
          path: release/AKASH-TUNNEL-MAPPER-User-Setup.exe
          if-no-files-found: error

      - name: Upload Direct Master Windows .EXE Artifact (AKASH-TUNNEL-MAPPER-Master-Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: AKASH-TUNNEL-MAPPER-Master-Setup.exe
          path: release/AKASH-TUNNEL-MAPPER-Master-Setup.exe
          if-no-files-found: error

      - name: Upload Direct User Android .APK Artifact (ESWA-TUNNEL-MAPPER-User-Android.apk)
        uses: actions/upload-artifact@v4
        with:
          name: ESWA-TUNNEL-MAPPER-User-Android.apk
          path: release/ESWA-TUNNEL-MAPPER-User-Android.apk
          if-no-files-found: warn

      - name: Upload Direct Master Android .APK Artifact (ESWA-TUNNEL-MAPPER-Master-Android.apk)
        uses: actions/upload-artifact@v4
        with:
          name: ESWA-TUNNEL-MAPPER-Master-Android.apk
          path: release/ESWA-TUNNEL-MAPPER-Master-Android.apk
          if-no-files-found: warn

      - name: Upload Combined Master & User .EXE + .APK + OTA Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AKASH-TUNNEL-MAPPER-Master-and-User-Installers
          path: |
            release/AKASH-TUNNEL-MAPPER-Master-Setup.exe
            release/AKASH-TUNNEL-MAPPER-User-Setup.exe
            release/ESWA-TUNNEL-MAPPER-Master-Android.apk
            release/ESWA-TUNNEL-MAPPER-User-Android.apk
            release/user-ota-bundle.json
            release/latest-release.json
          if-no-files-found: error

      - name: Update Rolling 'latest' Tag to Current Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest Master & User Windows .EXE + Android .APK Build #${{ github.run_number }}"
          git push origin latest --force

      - name: Publish Master & User Windows .EXE + Android .APK to GitHub Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          make_latest: true
          name: "AKASH TUNNEL MAPPER — Official Windows .EXE & Android .APK Installers [Build #${{ github.run_number }}]"
          body: |
            ### Official Windows PC Software (.EXE) & Standalone Android Apps (.APK) — Build #${{ github.run_number }}
            1. **User PC Software (.EXE — Share with PC Users):** `AKASH-TUNNEL-MAPPER-User-Setup.exe`
               - Direct Download Link: `https://github.com/${{ github.repository }}/releases/download/latest/AKASH-TUNNEL-MAPPER-User-Setup.exe`
            2. **Master PC Software (.EXE — Owner Only):** `AKASH-TUNNEL-MAPPER-Master-Setup.exe`
               - Direct Download Link: `https://github.com/${{ github.repository }}/releases/download/latest/AKASH-TUNNEL-MAPPER-Master-Setup.exe`
            3. **User Standalone Android App (.APK — Share with Mobile Users):** `ESWA-TUNNEL-MAPPER-User-Android.apk`
               - Direct Download Link: `https://github.com/${{ github.repository }}/releases/download/latest/ESWA-TUNNEL-MAPPER-User-Android.apk`
            4. **Master Standalone Android App (.APK — Owner Only):** `ESWA-TUNNEL-MAPPER-Master-Android.apk`
               - Direct Download Link: `https://github.com/${{ github.repository }}/releases/download/latest/ESWA-TUNNEL-MAPPER-Master-Android.apk`
            5. **Live In-App Auto-Update Bundle (Zero Data Deletion):** `user-ota-bundle.json`
          files: |
            release/AKASH-TUNNEL-MAPPER-Master-Setup.exe
            release/AKASH-TUNNEL-MAPPER-User-Setup.exe
            release/ESWA-TUNNEL-MAPPER-Master-Android.apk
            release/ESWA-TUNNEL-MAPPER-User-Android.apk
            release/user-ota-bundle.json
            release/latest-release.json
          prerelease: false
