name: Build Windows & Android Engineering Suite (.EXE + .APK)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    name: Build Production Windows Executable (.EXE) & Android App (.APK)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Runner Paths & Environment
        run: |
          if [ -d "/c/Program Files/Git/usr/bin" ]; then
            echo "/c/Program Files/Git/usr/bin" >> $GITHUB_PATH
            echo "C:\Program Files\Git\usr\bin" >> $GITHUB_PATH
          fi
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true" >> $GITHUB_ENV
          echo "CI=false" >> $GITHUB_ENV

      - name: Normalize Public NPM Package Versions
        run: node scripts/normalize-ci-package.mjs

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --include=dev

      - name: Build Master & User Windows Executables (.EXE) + Master & User Android Apps (.APK)
        run: node scripts/build-dual-installers.mjs
        env:
          CI: false
          GITHUB_ACTIONS: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_APP_BUILD_VERSION: "1.0.${{ github.run_number }}"
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - name: Upload Master Windows .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESWA-GEOLOGICAL-MAPPER-Master-Setup
          path: release/ESWA-GEOLOGICAL-MAPPER-Master-Setup.exe
          if-no-files-found: warn

      - name: Upload User Windows .EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESWA-GEOLOGICAL-MAPPER-User-Setup
          path: release/ESWA-GEOLOGICAL-MAPPER-User-Setup.exe
          if-no-files-found: warn

      - name: Upload Master Android .APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESWA-GEOLOGICAL-MAPPER-Master-Android
          path: release/ESWA-GEOLOGICAL-MAPPER-Master-Android.apk
          if-no-files-found: warn

      - name: Upload User Android .APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESWA-GEOLOGICAL-MAPPER-User-Android
          path: release/ESWA-GEOLOGICAL-MAPPER-User-Android.apk
          if-no-files-found: warn

      - name: Clean Previous 'latest' Release & Update Rolling Tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest Master & User Windows .EXE + Android .APK Build #${{ github.run_number }}"
          git push origin latest --force || true

      - name: Publish Master EXE, User EXE, Android APK Master & Android APK User to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: false
          name: "ESWA GEOLOGICAL MAPPER — Official Installers [Build #${{ github.run_number }}]"
          body: |
            ### ESWA GEOLOGICAL MAPPER — Official Software & Android Releases (Build #${{ github.run_number }})
            1. **Master EXE (Windows Master Suite):** `ESWA-GEOLOGICAL-MAPPER-Master-Setup.exe`
            2. **User EXE (Windows Geologist Workstation):** `ESWA-GEOLOGICAL-MAPPER-User-Setup.exe`
            3. **Android APK Master (Master Admin Mobile/Tablet):** `ESWA-GEOLOGICAL-MAPPER-Master-Android.apk`
            4. **Android APK User (Field Geologist Mobile/Tablet):** `ESWA-GEOLOGICAL-MAPPER-User-Android.apk`
          files: |
            release/ESWA-GEOLOGICAL-MAPPER-Master-Setup.exe
            release/ESWA-GEOLOGICAL-MAPPER-User-Setup.exe
            release/ESWA-GEOLOGICAL-MAPPER-Master-Android.apk
            release/ESWA-GEOLOGICAL-MAPPER-User-Android.apk
          prerelease: false
