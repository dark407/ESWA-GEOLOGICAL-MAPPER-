# ESWA Geological Mapper — Standalone Software Distribution Website (Netlify Config)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_STANDALONE_WEBSITE = "true"

# SPA Rewrite Rules for /website and root routes
[[redirects]]
  from = "/website/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
