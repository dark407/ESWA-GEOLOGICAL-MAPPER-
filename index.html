    <script>
      (function () {
        function shouldSuppressError(msg) {
          if (!msg) return false;
          var s = String(msg);
          return (
            s === 'Script error.' ||
            s === 'Script error' ||
            s.indexOf('ResizeObserver loop') !== -1 ||
            s.indexOf('WebSocket closed without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('FIRESTORE') !== -1 ||
            s.indexOf('ca9') !== -1 ||
            s.indexOf('b815') !== -1 ||
            s.indexOf('INTERNAL ASSERTION FAILED') !== -1 ||
            s.indexOf('Unexpected state') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var msg = event && event.message ? String(event.message) : '';
            if (shouldSuppressError(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var msg =
              event && event.reason
                ? String(event.reason.message || event.reason)
                : '';
            if (shouldSuppressError(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );

        var origAddEventListener = window.addEventListener;
        window.addEventListener = function (type, listener, options) {
          if (
            (type === 'error' || type === 'unhandledrejection') &&
            typeof listener === 'function'
          ) {
            var wrapped = function (event) {
              var msg =
                type === 'error'
                  ? event && event.message
                    ? String(event.message)
                    : ''
                  : event && event.reason
                    ? String(event.reason.message || event.reason)
                    : '';
              if (shouldSuppressError(msg)) {
                return;
              }
              return listener.apply(this, arguments);
            };
            return origAddEventListener.call(this, type, wrapped, options);
          }
          return origAddEventListener.apply(this, arguments);
        };
      })();
    </script>
