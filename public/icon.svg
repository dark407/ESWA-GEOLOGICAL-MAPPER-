  <!-- Letters 'W' and 'A' -->
  <path d="M 426 364 L 466 364 L 490 472 L 520 364 L 554 364 L 584 472 L 608 364 L 648 364 L 604 538 L 566 538 L 537 432 L 508 538 L 470 538 Z M 686 364 L 730 364 L 792 538 L 748 538 L 736 502 L 678 502 L 666 538 L 624 538 Z M 707 412 L 688 470 L 726 470 Z" fill="url(#eswaLettersBlueRockGrad)" stroke="#090D14" stroke-width="5" stroke-linejoin="round" />
</svg>
