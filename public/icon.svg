  <g clip-path="url(#eswaMtnPeakClip)">
    <polygon points="222,332 346,118 368,144 452,22 686,332" fill="url(#eswaMtnPeakGrad)" />
    <ellipse cx="452" cy="96" rx="28" ry="42" transform="rotate(-14 452 96)" fill="none" stroke="#94A3B8" stroke-width="2" />
    <ellipse cx="352" cy="176" rx="26" ry="34" transform="rotate(18 352 176)" fill="none" stroke="#94A3B8" stroke-width="2" />
  </g>
  <polygon points="222,332 346,118 368,144 452,22 686,332" fill="none" stroke="#05070A" stroke-width="11" stroke-linejoin="miter" />

  <!-- 2. TOPOGRAPHIC EAGLE HEAD WITH GEOLOGICAL COMPASS EYE -->
  <path d="M 272 268 C 318 228, 378 190, 444 186 C 476 184, 502 194, 514 208 C 546 210, 578 224, 590 250 C 598 268, 594 292, 578 308 C 574 292, 562 280, 544 278 C 516 276, 488 292, 464 316 C 452 328, 444 342, 440 354" fill="none" stroke="#FFFFFF" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" />
